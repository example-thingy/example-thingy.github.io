<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./scripts.js" defer></script>
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <button type="button" id="clickToStart">Click to get started...</button>

    <button type="button" id="clickToStartPurgatory">Maybe click this?</button>

    <style>
        #clickToStartPurgatory {
            position: fixed;
            bottom: 20;
            right: 20;
        }
    </style>
    
    <script>
        const button = document.getElementById('clickToStart')

        button.addEventListener('click', function () {
            alert('Try scrolling...');
        });

        const purgatory = document.getElementById('clickToStartPurgatory')

        purgatory.addEventListener('click', function () {
            window.location.href = "/startofpurgatory"
        });
    </script>
</body>

</html>
