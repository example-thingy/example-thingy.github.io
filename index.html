<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./scripts.js" defer></script>
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
    
<body>
    <button type="button" id="clickToStart">Click to get started...</button>

    <button type="button" id="clickToStartPurgatory">Maybe click this?</button>

<style>
    #clickToStartPurgatory {
        position: fixed;
        bottom: 20;
        right: 20;
    }
            /* Remove default margins and hide scrollbars if you want a seamless look */
        body {
            margin: 0;
            overflow: auto; /* Allows scrolling around the massive canvas */
            background-color: #111;
        }

        canvas {
            display: block; /* Removes default inline spacing alignment issues */
        }
</style>
    
    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            // 1. Calculate 2.5 times the screen/viewport dimensions
            const targetWidth = window.innerWidth * 2.5;
            const targetHeight = window.innerHeight * 2.5;

            // 2. Set the internal drawing resolution
            canvas.width = targetWidth;
            canvas.height = targetHeight;

            // 3. Set the CSS display size to match
            canvas.style.width = targetWidth + 'px';
            canvas.style.height = targetHeight + 'px';

            // Optional: Draw something to verify the size
            drawSampleContent();
        }

        function drawSampleContent() {
            // Draw a border and a rectangle to show the scale
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 10;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.font = '48px sans-serif';
            ctx.fillText('Canvas Center', canvas.width / 2 - 150, canvas.height / 2);
        }

        // Initialize and listen for window resizing
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        const button = document.getElementById('clickToStart')

        button.addEventListener('click', function () {
            alert('Try scrolling...');
        });

        const purgatory = document.getElementById('clickToStartPurgatory')

        purgatory.addEventListener('click', function () {
            window.location.href = "/startofpurgatory"
        });
    </script>
</body>

</html>
